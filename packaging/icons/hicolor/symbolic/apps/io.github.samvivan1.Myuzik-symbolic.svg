<?xml version="1.0" encoding="UTF-8"?>
<!--
  Myuzik symbolic icon: monogram and stylus only.

  MIT. GTK recolours a "-symbolic" icon from its own palette, so this is one opaque
  silhouette on a 16 px grid: no plate, no ring, no gradient. The ring is dropped on
  purpose - at 16 px it turns the silhouette into grey mush.

  Same construction as the coloured icon: monogram and stylus are one unioned contour,
  so no ledge shows where they meet.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16"
     role="img" aria-label="Myuzik">
  <title>Myuzik</title>
